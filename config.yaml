# Shared configuration for the INQUIRE-CSI notebooks (Pt1, Pt2, Pt3).
# Paths are relative to the location of this file, unless absolute.
# Defaults: every notebook reads from its own input folder (if it has one) and from the
# output folder(s) of the preceding notebook, and writes to its own output folder.

# Root working folder
data_dir: data

# Subfolders of data_dir
folders:
  preprocessing_in: preprocessing_in    # Pt1 input:  raw databases, sample data, lookups/source_class_mapping.xlsx
  preprocessing_out: preprocessing_out  # Pt1 output: read by Pt2
  analysis_in: analysis_in              # Pt2 extra input: geo_metadata_outputs/household_metadata_priors.csv
  analysis_out: analysis_out            # Pt2 output: read by Pt3
  visualization_out: visualization_out  # Pt3 output: figures

# Input file names (inside folders: preprocessing_in)
files:
  sample_data: Sample_Data.xlsx         # Pt1 input: non-target screening results, one column per sample

# Blank / QC columns in the sample data (Pt1). Adapt to your own sample data.
# Only sample columns (the columns after "Concentration Type") are checked; identifier columns are never dropped.
qc_columns:
  drop: true                  # true = drop the matching columns; false = keep them (they are then analyzed as samples)
  names:                      # exact column names
    - Blank_NIST
  prefixes: ["7S_CS"]         # drop every column starting with one of these, e.g. ["7S_CS", "FR_Field_Blank"]
  patterns: ["(?i)blank"]     # regular expressions matched anywhere in the column name (here: case-insensitive "blank")
